[project]
name = "mini-file-audit"
version = "0.1.0"
description = "Python CLI tool that scans a local folder and generates a CSV file audit report."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mini-file-audit = "mini_file_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
